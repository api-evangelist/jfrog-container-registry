specification: API Commons MCP
specificationVersion: '0.1'
provider: JFrog Container Registry
providerId: jfrog-container-registry
name: JFrog MCP Server
generated: '2026-08-29'
modified: '2026-08-29'
method: searched
status: published
source: https://github.com/jfrog/jfrog-mcp-server
docs: https://docs.jfrog.com/integrations/docs/add-the-jfrog-mcp-server-to-an-mcp-client
description: >-
  JFrog ships a first-party REMOTE MCP server hosted on the customer's own JFrog Platform
  Deployment (JPD). It is generally available on JFrog Cloud (SaaS) and in Beta for
  self-managed installs. The tool surface below is JFrog's own published TOOLS.md reference,
  captured verbatim as tool names; it covers the Artifactory repository, storage and package
  surface that backs JFrog Container Registry, alongside the rest of the JFrog Platform.
scope_note: >-
  This is the JFrog Platform MCP server, not a container-registry-only server. JFrog Container
  Registry is a JFrog Ltd product served by the same platform, and its Docker/OCI repositories
  are addressed through the artifactory_repositories_* and artifactory_storage_* tools.
deployment:
  mode: both
  endpoint: 'https://<JFROG_PLATFORM_URL>/mcp'
  endpoint_note: >-
    Templated per tenant. JFrog's README documents the MCP client config as
    {"mcpServers":{"jfrog":{"url":"https://<JFROG_PLATFORM_URL>/mcp"}}} where
    <JFROG_PLATFORM_URL> is the customer's own JPD, e.g. https://mycompany.jfrog.io.
    There is no shared multi-tenant endpoint to probe anonymously, so no live tools/list
    response was obtained.
  install: 'Helm chart or Docker Compose (self-managed, Beta) — see https://docs.jfrog.com/installation/docs/mcp'
  package: https://github.com/jfrog/jfrog-mcp-server
  auth: oauth
  verified: searched
availability:
  cloud_saas: GA
  self_managed: Beta
  enablement: >-
    An Admin user must enable the JFrog MCP Server on a JPD before clients can connect.
    See https://jfrog.com/help/r/jfrog-integrations-documentation/enable-the-jfrog-mcp-server
deprecated_predecessor:
  name: mcp-jfrog
  repo: https://github.com/jfrog/mcp-jfrog
  status: deprecated
  note: >-
    The earlier local-stdio Model Context Protocol server for the JFrog Platform API.
    JFrog marks the repository Deprecated in favour of the remote server above.
other_endpoints_observed:
  - url: https://docs.jfrog.com/mcp
    probe: 'POST tools/list -> 401 {"jsonrpc":"2.0","error":{"code":-32001,"message":"Authorization required"}}'
    note: >-
      A documentation MCP endpoint served on JFrog's docs host (response headers show
      Cloudflare in front of a Render origin, i.e. the ReadMe docs platform). It is
      auth-gated and is NOT the JFrog Platform MCP server. Recorded for completeness;
      no tool schemas could be read anonymously.
