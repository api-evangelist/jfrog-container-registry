standing_notices:
  - since: 7.153.2
    text: >-
      NuGet remote repositories proxying community.chocolatey.org have an enforced minimum
      Metadata Cache Retrieval Period of four hours (14400 seconds).
  - upcoming: true
    text: >-
      On Artifactory SaaS, remote repositories will have a minimum Metadata Retrieval Cache
      Period of 30 seconds; smart remote repositories are exempt. JFrog states the minimum
      "supports consistent service availability for Agentic workflows".
  - since: 7.98.7
    text: >-
      Recent self-managed Artifactory versions contain important changes to authentication —
      read the self-managed release notes before upgrading.
