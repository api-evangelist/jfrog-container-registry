specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: JFrog Container Registry
providerId: jfrog-container-registry
created: '2026-05-04'
generated: '2026-08-29'
modified: '2026-08-29'
method: searched
source: https://jfrog.com/pricing/
supersedes: >-
  The 2026-05-04 bulk-sweep scaffold that previously occupied this file. That version carried
  invented request quotas (1,000/month free, 100,000/month pro) and invented rate limits that
  JFrog has never published. It has been replaced wholesale with the tiers read off JFrog's
  own pricing page on 2026-08-29.
tags:
  - Container Images
  - Containers
  - Docker
  - Helm
  - JFrog
  - Registry
description: >-
  JFrog's published subscription tiers. Note the pricing dimension: JFrog does NOT meter API
  requests. It meters CONSUMPTION — storage plus data transfer, in GB — so there is no request
  quota to record. Container registry (Docker and OCI repositories) is included from the Pro
  tier upward.
billing_dimension: 'consumption (GB of storage + data transfer), not API requests'
plan_count: 6
free_tier: false
free_trial:
  available: true
  url: https://jfrog.com/start-free/
  note: >-
    JFrog markets "Start Free" as a trial of Artifactory and Xray. The historical standalone
    free JFrog Container Registry product is no longer listed as a tier on the pricing page.
plans:
