    deployment: saas
    type: paid
    price: '50.00'
    currency: USD
    billing_period: month
    price_note: >-
      $50/month is a limited-time offer stated on the pricing page; the regular price shown is
      $150/month.
    included:
      consumption_gb: 25
    overage:
      metric: consumption_gb
      tiers:
        - range: '25 – 1,204 GB'
          price_per_gb: '1.25'
        - range: '1,204 – 2,024 GB'
          price_per_gb: '1.00'
