    language: go
    kind: cli
    official: true
    version: v1.54.1
    published: '2022-11-08'
    note: >-
      proxy.golang.org resolves this module path only to the frozen v1 line; the v2 line
      (current jf CLI, 2.122.x) keeps the unversioned module path and is therefore not
      resolvable as github.com/jfrog/jfrog-cli/v2. The live v2 release date is the npm
      jfrog-cli-v2-jf entry above (2026-08-26), not this v1 date.
