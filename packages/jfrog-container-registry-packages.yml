specification: API Commons Packages
specificationVersion: '0.1'
provider: JFrog Container Registry
providerId: jfrog-container-registry
generated: '2026-08-29'
modified: '2026-08-29'
method: searched
source: >-
  Registry metadata endpoints queried unauthenticated on 2026-08-29 —
  registry.npmjs.org, proxy.golang.org, search.maven.org, pypi.org, rubygems.org,
  crates.io and azuresearch-usnc.nuget.org — cross-checked against the github.com/jfrog org.
description: >-
  First-party client libraries and CLI distributions for the JFrog Platform, which is what
  serves JFrog Container Registry. Every entry below was read from the registry's own
  metadata endpoint; `version` and `published` are the registry's values, not prose.
scope_note: >-
  JFrog does not ship a client library scoped to JFrog Container Registry alone. Container and
  Helm repositories are addressed either with standard OCI/Docker clients (docker, podman,
  helm, oras, buildx) or through the JFrog CLI and the platform clients below.
packages:
  - name: jfrog-cli-v2-jf
    registry: npm
    url: https://www.npmjs.com/package/jfrog-cli-v2-jf
    language: javascript
    kind: cli-installer
    official: true
    version: 2.122.0
    published: '2026-08-26'
    description: >-
      npm distribution of the JFrog CLI v2 `jf` binary — command-line interface for
      Artifactory, Xray, Distribution and Pipelines.
  - name: jfrog-client-js
    registry: npm
    url: https://www.npmjs.com/package/jfrog-client-js
    repo: https://github.com/jfrog/jfrog-client-js
    language: javascript
    kind: sdk
    official: true
    version: 2.9.0
    published: '2024-11-10'
    maintainer: jfrog-ecosystem <npm@jfrog.com>
    note: >-
      Published by the jfrog-ecosystem npm account. Last release 2024-11-10 — nearly two years
      before the current Artifactory 7.166.0 SaaS release, so it lags the API it wraps.
  - name: github.com/jfrog/jfrog-client-go
