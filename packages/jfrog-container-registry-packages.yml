    result: 404
    note: No first-party JFrog client on PyPI was found under these names.
  - registry: nuget
    query: jfrog
    result: 'no first-party package'
    note: >-
      The NuGet hits (Artifactory 2.3.2, JfrogPackage, Sharpliner.Extensions.JFrog) are
      third-party, not published by JFrog Ltd.
  - registry: rubygems
    checked:
